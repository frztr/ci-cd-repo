name: ci

on: 
  - workflow_dispatch
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet restore GreetingApi.slnx
      - run: dotnet build GreetingApi.slnx  --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            WebApp/bin/Release
            WebApp/obj
            WebAppTests/bin/Release
            WebAppTests/obj
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs

  docs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs
      - run: |
          git add docs
          git diff --staged --quiet || git commit -m "Update generated docs"
          git push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: dotnet test GreetingApi.slnx --configuration Release --no-build